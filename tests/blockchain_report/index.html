sts\nserver = ganache.server({\n    wallet: { mnemonic: MNEMONIC },\n    logging: { quiet: true } // Suppress verbose ganache logs\n});\nawait server.listen(8546);\n// 2. Wrap it with Ethers.js JsonRpcProvider\nprovider = new ethers.JsonRpcProvider(HOST);\n// 3. Setup wallets using known private keys for the test mnemonic\nconst privateKey1Hex = \&quot;0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80\&quot;;\nconst privateKey2Hex = \&quot;0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d\&quot;;\nconst wallet1 = new ethers.Wallet(privateKey1Hex, provider);\nconst wallet2 = new ethers.Wallet(privateKey2Hex, provider);\nw1Address = wallet1.address;\nw2Address = wallet2.address;\nprivateKey1 = wallet1.privateKey;\n// 4. Initialize EthConnector\nethConnector = new EthConnector(HOST, w1Address, w2Address, privateKey1);&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;708da629-a91f-4f11-994b-8787acbcf314&quot;,&quot;parentUUID&quot;:&quot;ac5ceed7-1412-4eb0-bd7f-cb45fbb482ad&quot;,&quot;isHook&quot;:true,&quot;skipped&quot;:false}],&quot;afterHooks&quot;:[{&quot;title&quot;:&quot;\&quot;after all\&quot; hook in \&quot;Blockchain Integration Tests with Ethers.js\&quot;&quot;,&quot;fullTitle&quot;:&quot;Blockchain Integration Tests with Ethers.js \&quot;after all\&quot; hook in \&quot;Blockchain Integration Tests with Ethers.js\&quot;&quot;,&quot;timedOut&quot;:false,&quot;duration&quot;:11,&quot;pass&quot;:false,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;if (server) {\n    await server.close();\n}&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;6f99567c-40dd-48a3-8f92-0ac765478fff&quot;,&quot;parentUUID&quot;:&quot;ac5ceed7-1412-4eb0-bd7f-cb45fbb482ad&quot;,&quot;isHook&quot;:true,&quot;skipped&quot;:false}],&quot;tests&quot;:[{&quot;title&quot;:&quot;should deploy a dummy Merkle root to the blockchain&quot;,&quot;fullTitle&quot;:&quot;Blockchain Integration Tests with Ethers.js should deploy a dummy Merkle root to the blockchain&quot;,&quot;timedOut&quot;:false,&quot;duration&quot;:132,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;slow&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;const dummyHashRoot = &#x27;1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef&#x27;;\n// Use ethConnector to deploy the hash root\nconst receipt = await ethConnector.deploy(dummyHashRoot);\nexpect(receipt).to.exist;\nexpect(receipt.transactionHash).to.be.a(&#x27;string&#x27;);\nexpect(receipt.status).to.be.true; // Transaction success status&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;817ca8ba-3fb7-4ada-9375-67cf530245f0&quot;,&quot;parentUUID&quot;:&quot;ac5ceed7-1412-4eb0-bd7f-cb45fbb482ad&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false},{&quot;title&quot;:&quot;should verify the hash transaction on the blockchain&quot;,&quot;fullTitle&quot;:&quot;Blockchain Integration Tests with Ethers.js should verify the hash transaction on the blockchain&quot;,&quot;timedOut&quot;:false,&quot;duration&quot;:68,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;medium&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;const dummyHashRoot = &#x27;abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890&#x27;;\nconst receipt = await ethConnector.deploy(dummyHashRoot);\n// Fetch the transaction using Ethers.js\nconst tx = await provider.getTransaction(receipt.transactionHash);\n// Verify transaction data contains the hash root\nexpect(tx).to.not.be.null;\n// Verify with Ethers.js directly\nexpect(tx.from.toLowerCase()).to.equal(w1Address.toLowerCase());\nexpect(tx.to.toLowerCase()).to.equal(w2Address.toLowerCase());\n// The data in tx.data should be \&quot;0x\&quot; + our dummyHashRoot\nexpect(tx.data).to.equal(&#x27;0x&#x27; + dummyHashRoot);\n// Verify with ethConnector&#x27;s built-in verifyHash method\nconst [ownerInfo, isValid] = await ethConnector.verifyHash(\n    receipt.transactionHash,\n    receipt.blockNumber,\n    dummyHashRoot,\n    w1Address\n);\nexpect(isValid).to.be.true;\nexpect(ownerInfo.toLowerCase()).to.equal((w1Address + w1Address).toLowerCase());&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;ff866972-b725-47df-9900-09cf367fd869&quot;,&quot;parentUUID&quot;:&quot;ac5ceed7-1412-4eb0-bd7f-cb45fbb482ad&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false},{&quot;title&quot;:&quot;should fetch the block details successfully&quot;,&quot;fullTitle&quot;:&quot;Blockchain Integration Tests with Ethers.js should fetch the block details successfully&quot;,&quot;timedOut&quot;:false,&quot;duration&quot;:38,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;medium&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;const dummyHashRoot = &#x27;1111111111111111111111111111111111111111111111111111111111111111&#x27;;\nconst receipt = await ethConnector.deploy(dummyHashRoot);\nconst block = await ethConnector.getBlock(receipt.blockNumber);\nexpect(block).to.not.be.null;\nexpect(block.number).to.equal(receipt.blockNumber);\nexpect(block.transactions).to.include(receipt.transactionHash);\nexpect(block.timestamp).to.be.a(&#x27;number&#x27;); // Web3 returns number for timestamps&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;613642bd-9f35-4490-95e8-b353a700cecc&quot;,&quot;parentUUID&quot;:&quot;ac5ceed7-1412-4eb0-bd7f-cb45fbb482ad&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false},{&quot;title&quot;:&quot;should fail to verify if the root does not match&quot;,&quot;fullTitle&quot;:&quot;Blockchain Integration Tests with Ethers.js should fail to verify if the root does not match&quot;,&quot;timedOut&quot;:false,&quot;duration&quot;:44,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;medium&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;const actualHashRoot = &#x27;2222222222222222222222222222222222222222222222222222222222222222&#x27;;\nconst wrongHashRoot = &#x27;3333333333333333333333333333333333333333333333333333333333333333&#x27;;\nconst receipt = await ethConnector.deploy(actualHashRoot);\nconst [ownerInfo, isValid] = await ethConnector.verifyHash(\n    receipt.transactionHash,\n    receipt.blockNumber,\n    wrongHashRoot,\n    w1Address\n);\nexpect(isValid).to.be.false;&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;1897e9f7-d35f-4ac2-97ab-552cfef88247&quot;,&quot;parentUUID&quot;:&quot;ac5ceed7-1412-4eb0-bd7f-cb45fbb482ad&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false},{&quot;title&quot;:&quot;should fail to verify if the sender address does not match&quot;,&quot;fullTitle&quot;:&quot;Blockchain Integration Tests with Ethers.js should fail to verify if the sender address does not match&quot;,&quot;timedOut&quot;:false,&quot;duration&quot;:36,&quot;state&quot;:&quot;passed&quot;,&quot;speed&quot;:&quot;fast&quot;,&quot;pass&quot;:true,&quot;fail&quot;:false,&quot;pending&quot;:false,&quot;code&quot;:&quot;const dummyHashRoot = &#x27;4444444444444444444444444444444444444444444444444444444444444444&#x27;;\nconst receipt = await ethConnector.deploy(dummyHashRoot);\n// Try to verify with a different wallet address\nconst wrongAddress = &#x27;0x1111111111111111111111111111111111111111&#x27;;\nconst [ownerInfo, isValid] = await ethConnector.verifyHash(\n    receipt.transactionHash,\n    receipt.blockNumber,\n    dummyHashRoot,\n    wrongAddress\n);\nexpect(isValid).to.be.false;&quot;,&quot;err&quot;:{},&quot;uuid&quot;:&quot;eb4dd840-c0d1-4a90-a0ed-28b5fd99961f&quot;,&quot;parentUUID&quot;:&quot;ac5ceed7-1412-4eb0-bd7f-cb45fbb482ad&quot;,&quot;isHook&quot;:false,&quot;skipped&quot;:false},{&quot;title&quot;:&quot;should fail to verify if the transaction is not in the block&quot;,&quot;fullTitle&quot;:&quot;Blockchain Integration Tests with Ethers.js should fail to verify if the transaction is not in the block&quot;,&quot;tim
